services:
  - type: web
    name: merchant-policy-agent-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && pip install -e . && python scripts/seed_commerce_data.py && python scripts/update_vastram_clothing.py && python scripts/enrich_vastram_products.py && python scripts/seed_vastram_orders.py"
    startCommand: "uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT"
