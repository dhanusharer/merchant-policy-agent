    <text x="375" y="25" font-size="11" font-weight="600" fill="#a7f3d0">MERCHANT SUPERVISORY CONTROL</text>
    <text x="1140" y="26" font-size="11" font-weight="500" fill="#94a3b8">Human / Audit Interface</text>

