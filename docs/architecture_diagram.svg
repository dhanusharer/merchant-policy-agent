    <rect x="0" y="0" width="1280" height="42" rx="16" fill="#064e3b"/>
    <path d="M 0 28 L 0 42 L 1280 42 L 1280 28 Z" fill="#064e3b"/>

    <circle cx="26" cy="21" r="8" fill="#34d399" />
