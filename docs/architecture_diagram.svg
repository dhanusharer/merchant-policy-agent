      <text x="14" y="46" font-size="11" fill="#cbd5e1">• Overview Dashboard (/): Real-time Verified KPIs</text>
      <text x="14" y="66" font-size="11" fill="#cbd5e1">• AI Decisions Ledger (/decisions): 11-Stage Trace</text>
      <text x="14" y="86" font-size="11" fill="#cbd5e1">• Policy Governance (/policies): Audit &amp; Promote</text>
      <text x="14" y="106" font-size="11" fill="#cbd5e1">• Learning Center (/learning): LinUCB Feature Weights</text>
      <text x="14" y="126" font-size="11" fill="#cbd5e1">• Activity Audit (/activity): Immutable Event Trail</text>
      <text x="14" y="144" font-size="10" font-family="monospace" fill="#5eead4">Truthful Telemetry: 100% reconciled to raw SQL</text>
    </g>

    <!-- Governance Box 2: Lifecycle Promotion -->
    <g transform="translate(434, 56)">
      <rect width="420" height="154" rx="8" fill="#042f2e" stroke="#115e59" stroke-width="1"/>
      <text x="14" y="24" font-size="13" font-weight="700" fill="#a7f3d0">PolicyLifecycleService &amp; Promotion Gating</text>
      <text x="14" y="46" font-size="11" fill="#cbd5e1">• Candidate Quarantine Registry (Sandbox Evaluation)</text>
      <text x="14" y="66" font-size="11" font-weight="600" fill="#facc15">• Rule: Learning &ne; Policy Promotion</text>
      <text x="14" y="86" font-size="11" fill="#cbd5e1">• Statistical Gate: Sample Size N &ge; 100 Verified Orders</text>
      <text x="14" y="106" font-size="11" fill="#cbd5e1">• Economic Gate: &Delta;Contribution Margin &gt; 0 vs Baseline</text>
      <text x="14" y="126" font-size="11" fill="#cbd5e1">• Safety Gate: Zero margin or stock violations</text>
      <text x="14" y="144" font-size="10" font-family="monospace" fill="#5eead4">Active Baseline Switch &amp; 1-Click Rollback</text>
    </g>

    <!-- Governance Box 3: Multi-Tenancy & DB -->
    <g transform="translate(874, 56)">
      <rect width="382" height="154" rx="8" fill="#042f2e" stroke="#115e59" stroke-width="1"/>
      <text x="14" y="24" font-size="13" font-weight="700" fill="#a7f3d0">Multi-Tenant Isolation &amp; Persistence</text>
      <text x="14" y="46" font-size="11" fill="#cbd5e1">• merch_atlas_travel (Atlas Travel Gear)</text>
      <text x="14" y="66" font-size="11" fill="#cbd5e1">• merch_alpha (Alpha Outfitters)</text>
      <text x="14" y="86" font-size="11" fill="#cbd5e1">• merch_95_alpha (Expedition Store)</text>
      <text x="14" y="108" font-size="11" fill="#34d399">• Row-Level WHERE merchant_id = :id</text>
      <text x="14" y="126" font-size="11" fill="#34d399">• Isolated LinUCB Covariance Matrices A_m, b_m</text>
      <text x="14" y="144" font-size="10" font-family="monospace" fill="#5eead4">Cross-tenant calls reject with HTTP 404/403</text>
    </g>
  </g>

  <!-- Inter-plane Feedback Arrow: Learning to Execution Selection -->
  <path d="M 700 580 L 650 580 L 650 318 L 576 318" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowIndigo)"/>
  <text x="635" y="460" font-size="10" font-family="monospace" fill="#818cf8" transform="rotate(-90 635 460)">Online Weights &theta;</text>

  <!-- Inter-plane Feedback Arrow: Governance to Execution Safety -->
  <path d="M 644 680 L 644 620 L 300 620 L 300 494" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowEmerald)"/>
  <text x="440" y="612" font-size="10" font-family="monospace" fill="#34d399">Governed Active Baseline Policy</text>

</svg>
