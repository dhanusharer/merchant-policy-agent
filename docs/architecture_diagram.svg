    <rect x="0" y="0" width="640" height="42" rx="16" fill="#071b33"/>
    <path d="M 0 28 L 0 42 L 640 42 L 640 28 Z" fill="#071b33"/>
    
    <text x="24" y="27" font-size="15" font-weight="800" fill="#3395ff">💳 RAZORPAY PAYMENT GATEWAY (TEST MODE)</text>
    <text x="460" y="27" font-size="11" font-weight="600" fill="#93c5fd">Financial Ground Truth</text>

    <!-- Inner Cards -->
    <g transform="translate(20, 56)">
      <rect width="180" height="74" rx="8" fill="#0a192f" stroke="#1e3a8a" stroke-width="1"/>
      <text x="14" y="25" font-size="11" font-weight="700" fill="#93c5fd">1. Orders API</text>
      <text x="14" y="44" font-size="10" font-family="monospace" fill="#cbd5e1">ord_f48bc28a3ec6</text>
      <text x="14" y="62" font-size="10" fill="#64748b">Exact Paise (₹3,499)</text>
    </g>

    <line x1="208" y1="93" x2="228" y2="93" stroke="#3395ff" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <g transform="translate(236, 56)">
      <rect width="180" height="74" rx="8" fill="#0a192f" stroke="#1e3a8a" stroke-width="1"/>
      <text x="14" y="25" font-size="11" font-weight="700" fill="#93c5fd">2. Test Checkout</text>
      <text x="14" y="44" font-size="10" font-family="monospace" fill="#34d399">pay_178c87759c5a</text>
      <text x="14" y="62" font-size="10" fill="#64748b">Verified Settlement</text>
    </g>

    <line x1="424" y1="93" x2="444" y2="93" stroke="#3395ff" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <g transform="translate(452, 56)">
      <rect width="168" height="74" rx="8" fill="#0a192f" stroke="#1e3a8a" stroke-width="1"/>
      <text x="14" y="25" font-size="11" font-weight="700" fill="#93c5fd">3. HMAC Webhook</text>
      <text x="14" y="44" font-size="10" font-family="monospace" fill="#f59e0b">payment.captured</text>
      <text x="14" y="62" font-size="10" fill="#64748b">X-Razorpay-Signature</text>
    </g>
  </g>

  <!-- Connection: Exec Plane to Razorpay -->
  <path d="M 576 494 L 640 494 L 640 215 L 692 215" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCyan)"/>
  <text x="648" y="360" font-size="10" font-family="monospace" fill="#38bdf8" transform="rotate(-90 648 360)">POST /v1/orders</text>

  <!-- Connection: Razorpay Webhook to Learning Plane -->
  <path d="M 1020 290 L 1020 330" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrowIndigo)"/>

  <!-- ==================== PLANE 2: LEARNING PLANE ==================== -->
  <g transform="translate(700, 335)">
    <rect width="640" height="325" rx="16" fill="url(#learnGrad)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.6" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="640" height="42" rx="16" fill="#1e1b4b"/>
    <path d="M 0 28 L 0 42 L 640 42 L 640 28 Z" fill="#1e1b4b"/>
    
    <circle cx="26" cy="21" r="8" fill="#818cf8" />
    <text x="44" y="26" font-size="15" font-weight="700" fill="#f8fafc">2. LEARNING PLANE</text>
    <rect x="220" y="9" width="220" height="24" rx="4" fill="#4338ca" fill-opacity="0.4"/>
    <text x="230" y="25" font-size="11" font-weight="600" fill="#a5b4fc">AUTHORITATIVE FEEDBACK LOOP</text>
    <text x="525" y="26" font-size="11" font-weight="500" fill="#94a3b8">Asynchronous</text>

    <!-- Stage 10: Inbound Webhook -->
    <g transform="translate(20, 56)">
      <rect width="600" height="64" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
      <rect x="12" y="10" width="28" height="20" rx="4" fill="#6366f1"/>
      <text x="15" y="24" font-size="11" font-weight="700" fill="#ffffff">10</text>
      <text x="48" y="25" font-size="13" font-weight="700" fill="#e2e8f0">Cryptographic Webhook Ingestion &amp; Idempotency</text>
      <text x="535" y="25" font-size="11" font-weight="600" fill="#818cf8">4.1ms</text>
      <text x="14" y="48" font-size="11" fill="#94a3b8">• HMAC-SHA256 Signature Verification • Idempotent Deduplication (X-Event-Id)</text>
    </g>

    <!-- Stage 11: Outcome Feedback & Reward -->
    <g transform="translate(20, 130)">
      <rect width="600" height="88" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
      <rect x="12" y="10" width="28" height="20" rx="4" fill="#4f46e5"/>
      <text x="15" y="24" font-size="11" font-weight="700" fill="#ffffff">11</text>
      <text x="48" y="25" font-size="13" font-weight="700" fill="#e2e8f0">Outcome Feedback &amp; Gross Contribution Reward</text>
      <text x="535" y="25" font-size="11" font-weight="600" fill="#818cf8">7.5ms</text>
      <text x="14" y="48" font-size="11" fill="#cbd5e1">• If PAID: Reward r = Revenue - COGS (+₹1,599 gross profit) ➔ Commit stock to SOLD</text>
      <text x="14" y="66" font-size="11" fill="#ef4444">• If ABANDONED / FAILED: Reward r = ₹0 ➔ Release reserved stock back to available</text>
      <text x="14" y="82" font-size="10" font-family="monospace" fill="#a5b4fc">Zero financial leakage — Razorpay capture is the ONLY positive reward signal</text>
    </g>

    <!-- LinUCB Online Update -->
    <g transform="translate(20, 228)">
      <rect width="600" height="82" rx="8" fill="#111827" stroke="#4f46e5" stroke-width="1"/>
      <text x="14" y="24" font-size="12" font-weight="700" fill="#c7d2fe">Disjoint LinUCB Ridge Regression Online Update</text>
      <text x="14" y="44" font-size="11" font-family="monospace" fill="#a5b4fc">A &larr; A + x x^T  (Covariance 19x19)  |  b &larr; b + r x  (Reward Vector)  |  &theta; = A^-1 b</text>
      <text x="14" y="64" font-size="11" fill="#94a3b8">• Anti-Temporal Leakage: Ingests only settled events (t_event &lt; t_decision)</text>
      <text x="14" y="78" font-size="10" font-family="monospace" fill="#64748b">Persists: LearningEvidenceRecord &amp; PolicyMemoryRecord</text>
    </g>
  </g>

  <!-- ==================== PLANE 3: GOVERNANCE PLANE ==================== -->
  <g transform="translate(60, 680)">
