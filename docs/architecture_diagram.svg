<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <linearGradient id="execGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>

    <linearGradient id="learnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="govGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#062f26" />
    </linearGradient>

    <linearGradient id="rzpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340" />
      <stop offset="100%" stop-color="#143764" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowIndigo" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#818cf8" />
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#34d399" />
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#3395ff" />
    </marker>
  </defs>

  <!-- Background grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.3"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(60, 45)">
    <rect x="-10" y="-10" width="1280" height="70" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="20" y="32" font-size="24" font-weight="800" fill="#f8fafc" letter-spacing="0.5">🛒 MERCHANT POLICY AGENT</text>
    <text x="430" y="32" font-size="16" font-weight="500" fill="#94a3b8">|  Autonomous Commercial Policy Architecture</text>
    <rect x="910" y="10" width="340" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="925" y="32" font-size="12" font-weight="600" fill="#38bdf8">LLM Proposes ➔ Code Validates ➔ Razorpay Reports ➔ Learns</text>
  </g>

  <!-- ==================== PLANE 1: EXECUTION PLANE ==================== -->
  <g transform="translate(60, 140)">
    <!-- Plane Container -->
    <rect x="0" y="0" width="600" height="520" rx="16" fill="url(#execGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" filter="url(#cardShadow)"/>
    
    <!-- Plane Header -->
    <rect x="0" y="0" width="600" height="48" rx="16" fill="#1e293b" fill-opacity="0.8"/>
    <path d="M 0 32 L 0 48 L 600 48 L 600 32 Z" fill="#1e293b" fill-opacity="0.8"/>
    <circle cx="28" cy="24" r="8" fill="#38bdf8" />
    <text x="46" y="29" font-size="15" font-weight="700" fill="#f8fafc">1. EXECUTION PLANE</text>
    <rect x="230" y="12" width="180" height="24" rx="4" fill="#0369a1" fill-opacity="0.4"/>
    <text x="240" y="28" font-size="11" font-weight="600" fill="#7dd3fc">REAL-TIME FAST PATH (&lt; 70ms)</text>
    <text x="505" y="28" font-size="11" font-weight="500" fill="#94a3b8">Deterministic</text>

    <!-- Stage 1 & 2: Intent Ingestion -->
    <g transform="translate(24, 70)">
      <rect width="552" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="12" width="28" height="20" rx="4" fill="#0284c7"/>
      <text x="17" y="26" font-size="11" font-weight="700" fill="#ffffff">1-2</text>
      <text x="48" y="27" font-size="13" font-weight="700" fill="#e2e8f0">Intent Normalizer &amp; Extractor</text>
      <text x="485" y="27" font-size="11" font-weight="600" fill="#38bdf8">22.7ms</text>
      <text x="14" y="52" font-size="11" fill="#94a3b8">• Prompt Injection Defense • Unicode Normalizer • Hard Constraints vs Preferences</text>
      <text x="14" y="66" font-size="10" font-family="monospace" fill="#64748b">Contract: buyer-intent/v1 (Budget in Integer Paise)</text>
    </g>

    <!-- Arrow Down -->
    <line x1="300" y1="144" x2="300" y2="164" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <!-- Stage 3 & 4: Commerce & Policy LLM -->
    <g transform="translate(24, 168)">
      <rect width="552" height="84" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="12" width="28" height="20" rx="4" fill="#8b5cf6"/>
      <text x="17" y="26" font-size="11" font-weight="700" fill="#ffffff">3-4</text>
      <text x="48" y="27" font-size="13" font-weight="700" fill="#e2e8f0">Commerce Context &amp; LLM Policy Advisory Agent</text>
      <text x="485" y="27" font-size="11" font-weight="600" fill="#c084fc">18.4ms</text>
      <text x="14" y="52" font-size="11" fill="#94a3b8">• Catalog &amp; COGS Snapshot • Strategy Formulator (Bundle, Discount, Single, Standalone)</text>
      <text x="14" y="68" font-size="10" font-weight="600" fill="#f43f5e">INVARIANT: LLM generates candidate proposals only — ZERO financial spending authority</text>
    </g>

    <!-- Arrow Down -->
    <line x1="300" y1="252" x2="300" y2="272" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <!-- Stage 5 & 6: Deterministic Safety & Selection -->
    <g transform="translate(24, 276)">
      <rect width="552" height="84" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2"/>
      <rect x="12" y="12" width="28" height="20" rx="4" fill="#059669"/>
      <text x="17" y="26" font-size="11" font-weight="700" fill="#ffffff">5-6</text>
      <text x="48" y="27" font-size="13" font-weight="700" fill="#e2e8f0">Deterministic Safety Validator &amp; LinUCB Selector</text>
      <text x="490" y="27" font-size="11" font-weight="600" fill="#34d399">9.2ms</text>
      <text x="14" y="52" font-size="11" fill="#a7f3d0">• Margin Floor &ge; 25.00% • Discount Ceiling &le; 20.00% • Stock &gt; 0 • Integer Math</text>
      <text x="14" y="68" font-size="10" font-family="monospace" fill="#94a3b8">LinUCB 19-dim Context Vector x ➔ UCB = &theta;^T x + &alpha;&radic;(x^T A^-1 x) (Budget &le; 15%)</text>
    </g>

    <!-- Arrow Down -->
    <line x1="300" y1="360" x2="300" y2="380" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <!-- Stage 7, 8, 9: Boundary & Execution -->
    <g transform="translate(24, 384)">
      <rect width="552" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="12" width="28" height="20" rx="4" fill="#d97706"/>
      <text x="17" y="26" font-size="11" font-weight="700" fill="#ffffff">7-9</text>
      <text x="48" y="27" font-size="13" font-weight="700" fill="#e2e8f0">Execution Boundary &amp; Order Authorization</text>
      <text x="485" y="27" font-size="11" font-weight="600" fill="#fbbf24">31.8ms</text>
      <text x="14" y="52" font-size="11" fill="#94a3b8">• Fresh Row-Level Inventory Reservation (SELECT ... FOR UPDATE)</text>
      <text x="14" y="70" font-size="11" fill="#94a3b8">• Cryptographic HMAC-SHA256 Authorization Token Signing</text>
      <text x="14" y="88" font-size="10" font-family="monospace" fill="#fbbf24">Emits: POST /v1/orders to Razorpay (Integer Paise Amount)</text>
    </g>
  </g>

  <!-- ==================== RAZORPAY GATEWAY ==================== -->
  <g transform="translate(700, 140)">
